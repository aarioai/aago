rabbitmq:
  DEFAULT:
    addr: 127.0.0.1:5672
    user: replace-with-your-username
    password: replace-with-your-password
    vhost: /  # default: "/"
    channelMax: 2047 # caps the number of channels. 0 means 2^16 - 1.
    frameSize: 0
    heartbeat: 0s  # Less than 1s uses the server's interval.
    baseReconnectInterval: 5s # rabbitmq.ConnectionOptions.BaseReconnectInterval
  events:
    vhost: /events
    heartbeat: 15s
